name: Xuất bản dashboard GitHub Pages

on:
  push:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chạy kiểm thử
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Kiểm tra JavaScript
        run: node --check dashboard/app.js
      - name: Tạo dữ liệu dashboard
        run: python -X utf8 scripts/build_dashboard.py
      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5
      - name: Đóng gói dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Xuất bản
        id: deployment
        uses: actions/deploy-pages@v4
