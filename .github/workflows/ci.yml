name: Kiểm tra dữ liệu và mã nguồn

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chạy kiểm thử
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Kiểm tra JavaScript
        run: node --check dashboard/app.js
      - name: Kiểm tra khả năng tạo dashboard
        run: python -X utf8 scripts/build_dashboard.py --output finance-dashboard-data.json
