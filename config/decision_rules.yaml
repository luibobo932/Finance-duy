# Khung rule cho decision/policy_engine.py + decision/risk_officer.py
# (Phase 7). Phase 3 chỉ khai báo cấu trúc + rule vàng (đã đủ dữ kiện để
# code ngay: chủ dự án đang có 74.7% tài sản là vàng). Rule chứng khoán/
# dữ liệu sẽ điền tiếp ở Phase 6-7.

gold:
  # Ngưỡng lấy từ risk_limits.yaml qua code, không lặp số ở đây — nhưng ghi
  # rõ ý nghĩa hành động ứng với từng mức để dễ đọc.
  #
  # Khi tín hiệu thị trường đề xuất MUA THÊM ("có được mua thêm không?"):
  #
  # ⚠️ 14/08/2026 — đổi từ DO_NOT_BUY_MORE sang TAKE_PARTIAL_PROFIT. Lý do là
  # một MÂU THUẪN đo được, không phải đổi khẩu vị:
  #     vàng 65% (warning)  + tín hiệu TICH_CUC → CHỐT BỚT
  #     vàng 76% (critical) + tín hiệu TICH_CUC → KHÔNG MUA THÊM  ← NHẸ HƠN
  #     vàng 76% (critical) + tín hiệu TRUNG_TINH → CHỐT BỚT
  # Rủi ro tệ hơn mà lời khuyên dịu đi, và kết quả còn lật theo việc tín hiệu
  # thị trường tình cờ là gì.
  #
  # Yêu cầu gốc "vàng ≥70% thì KHÔNG cho phép đề xuất mua thêm" KHÔNG mất:
  # đề xuất mua vẫn bị veto (`gold_concentration_critical`), câu "KHÔNG MUA
  # THÊM vàng" vẫn được ghi thẳng vào warnings, và CHỐT BỚT về logic đã bao
  # hàm việc không mua thêm. Đổi lại DO_NOT_BUY_MORE ở đây nếu muốn hệ thống
  # chỉ chặn mua và không tự đề xuất giảm tỷ trọng — khi đó risk_officer sẽ
  # ghi một dòng cảnh báo vì cấu hình mâu thuẫn với nấc warning bên dưới.
  above_critical_action: TAKE_PARTIAL_PROFIT  # >= gold_critical (70%)
  above_warning_action: TAKE_PARTIAL_PROFIT   # >= gold_warning (60%), < critical
  below_warning_action: HOLD                  # < gold_warning
  #
  # Khi tín hiệu thị trường đề xuất GIỮ / ĐỨNG NGOÀI mà tỷ trọng ĐÃ vượt
  # critical ("giữ nguyên có ổn không?"). Nhánh này trước đây bị bỏ trống:
  # rule chỉ chạy khi đề xuất là mua, nên vàng 75,1% vẫn ra "GIỮ, tin cậy 92"
  # trong 6 bản tin liên tiếp — ngưỡng critical chỉ chặn được việc mua thêm
  # chứ không nói được gì khi danh mục đã lệch quá xa khẩu vị đã đặt.
  concentrated_hold_action: TAKE_PARTIAL_PROFIT
  # Đặt false nếu chủ danh mục CHẤP NHẬN mức tập trung hiện tại và chỉ muốn hệ
  # thống chặn mua thêm, không tự đề xuất chốt bớt. Khi tắt, hệ thống vẫn ghi
  # một dòng cảnh báo để việc tắt là lựa chọn hiển thị, không phải im lặng.
  escalate_hold_above_critical: true

equity:
  # Trạng thái quản trị (Phase 6, equity/governance.py) chặn đề xuất mua
  governance_block_states:
    - INDICTED
    - CONVICTED
    - INVESTIGATION_OPENED
  # Trạng thái CHỈ cảnh báo, KHÔNG tự động chặn (cần xác minh thêm)
  governance_watch_states:
    - RUMOR
    - UNDER_VERIFICATION
    - SUMMONED_FOR_QUESTIONING

transaction_costs:
  # Phí giao dịch MỖI CHIỀU của công ty chứng khoán đang dùng (%). Khoảng thị
  # trường 0,15–0,35%; để 0,2% là mức phổ biến. Sửa theo biểu phí thật.
  #
  # Thuế bán 0,1% và thuế cổ tức tiền mặt 5% KHÔNG khai ở đây vì đó là quy
  # định pháp luật, không phải lựa chọn của chủ danh mục — xem equity/costs.py.
  brokerage_fee_pct: 0.2

data_quality:
  # Risk Officer (Phase 7) veto khi gặp các điều kiện này
  veto_on_stale_critical_data: true
  veto_on_conflicting_critical_sources: true
  veto_on_missing_critical_financial_data: true
  veto_on_abnormal_price_data: true
  max_age_seconds:
    gold_price: 43200        # 12 giờ — vàng biến động nhanh
    equity_price: 172800     # 48 giờ — chấp nhận rộng hơn vì có cuối tuần
    deposit_rate: 2592000    # 30 ngày — lãi suất đổi chậm
